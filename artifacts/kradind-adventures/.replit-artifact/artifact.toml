kind = "web"
previewPath = "/"
title = "KRADIND Adventures"
description = "A premium trekking and travel booking experience for discovering, comparing, and booking curated adventures across India and beyond."
version = "1.0.0"
id = "artifacts/kradind-adventures"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19029

[services.development]
run = "pnpm --filter @workspace/kradind-adventures run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kradind-adventures", "run", "build" ]
serve = "static"
publicDir = "artifacts/kradind-adventures/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19029"
BASE_PATH = "/"
