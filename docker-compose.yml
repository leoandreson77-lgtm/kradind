services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kradind-adventures
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://leoandreson77_db_user:QviGuHX49u5WpE6R@cluster0.20c8rgm.mongodb.net/flight_search?retryWrites=true&w=majority}
      - DATABASE_URL=${DATABASE_URL:-mongodb+srv://leoandreson77_db_user:QviGuHX49u5WpE6R@cluster0.20c8rgm.mongodb.net/flight_search?retryWrites=true&w=majority}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-kradind-secure-secret-key-himalayan-adventures-2026}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    volumes:
      # Persist CMS configuration and offline JSON catalog
      - kradind_cms_data:/app/artifacts/kradind-adventures/data
      # Persist uploaded images and brochures
      - kradind_uploads:/app/artifacts/kradind-adventures/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  kradind_cms_data:
    name: kradind_cms_data
  kradind_uploads:
    name: kradind_uploads
